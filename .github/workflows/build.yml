name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tizim kutubxonalarini o'rnatish
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake autopoint gettext
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

      - name: Buildozer o'rnatish
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer Cython==0.29.36

      - name: Buildozer keshini tiklash
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: APK qurish
        run: |
          yes | buildozer -v android debug

      - name: APK faylni saqlash (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: smart-lugat-apk
          path: bin/*.apk
